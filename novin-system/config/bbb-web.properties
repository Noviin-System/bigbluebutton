# ==============================================================================
# Override Target: /etc/bigbluebutton/bbb-web.properties
# Replaces Default: /usr/share/bbb-web/WEB-INF/classes/bigbluebutton.properties
# Applied via:      bbb-conf --restart
# ==============================================================================

bigbluebutton.web.serverURL=https://__DOMAIN__
securitySalt=@myBBBSecret@
webcamsOnlyForModerator=true
defaultWelcomeMessageFooter=
pluginManifests=[{"url":"https://s3.novin-system.com/cdn/bbb/plugins/bbb-plugin-pick-random-user/manifest.json"}]
beans.presentationService.defaultUploadedPresentation=https://s3.novin-system.com/cdn/bbb/default.pdf
pluginManifestCacheEnabled=true
