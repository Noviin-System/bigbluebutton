# ==============================================================================
# Override Target: /etc/systemd/system/bbb-web.service.d/override.conf
# Service:         bbb-web.service
# Applied via:     systemctl daemon-reload && systemctl restart bbb-web
# Description:     Increases file descriptors, thread limits, and runtime env for bbb-web
# ==============================================================================

[Service]
LimitNOFILE=65536
LimitNOFILESoft=65536
TasksMax=infinity
Environment="XDG_RUNTIME_DIR=/run/user/__BBB_UID__"
