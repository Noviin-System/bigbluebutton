# ==============================================================================
# Target Path:      /etc/turnserver.conf
# Service:          coturn.service
# ==============================================================================

listening-port=3478
listening-ip=__SERVER_IP__
relay-ip=__SERVER_IP__
external-ip=__SERVER_IP__

min-port=32769
max-port=65535
verbose

fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=__TURN_SECRET__
realm=__DOMAIN__
server-name=__DOMAIN__
keep-address-family

no-cli

no-loopback-peers
no-multicast-peers

allowed-peer-ip=__SERVER_IP__
